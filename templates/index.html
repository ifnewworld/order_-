<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발주 관리 시스템</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* ── 이력 모달 ── */
    #logsBg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    #logsBg.open { display: flex; }
    .logs-modal {
      background: #fff; border-radius: 12px;
      width: min(680px, 96vw); max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
    }
    .logs-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--border, #e5e7eb);
    }
    .logs-modal-header h2 { margin: 0; font-size: 16px; font-weight: 700; }
    #logsBody { padding: 4px 24px; overflow-y: auto; flex: 1; }
  </style>
</head>
<body>

<!-- ── 앱 화면 ── -->
<div id="appScreen">

<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <span class="logo-icon">📦</span>
      <h1 class="app-title">발주 및 관리 시스템</h1>
    </div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-ghost" onclick="changeUser()" title="현재 사용자 변경">👤 사용자 변경</button>
      <button class="btn btn-ghost" onclick="openLogsModal()" title="전체 변경 이력">🕐 변경 이력</button>
      <button class="btn btn-ghost" onclick="exportXLSX()">엑셀 내보내기</button>
      <button class="btn btn-primary" onclick="openModal()">+ 상품 추가</button>
    </div>
  </div>
</header>

<main class="main">

  <!-- 통계 카드 -->
  <section class="stats-row" id="statsRow" style="align-items: center;">
    <div class="stat-card stat-card-btn" id="filterAll" onclick="setStatusFilter('all')"><div class="stat-label">전체 상품</div><div class="stat-val" id="statTotal">0</div></div>
    <div class="stats-arrow">▶</div>
    <div class="stat-card stat-card-btn" id="filterKorea" onclick="setStatusFilter('korea')"><div class="stat-label">한국으로 배송 중인 물품</div><div class="stat-val accent" id="statActive">0</div></div>
    <div class="stats-arrow">▶</div>
    <div class="stat-card stat-card-btn" id="filterFactory" onclick="setStatusFilter('factory')"><div class="stat-label">공장 도착</div><div class="stat-val green" id="statArrived">0</div></div>
    <div class="stats-arrow">▶</div>
    <div class="stat-card stat-card-btn" id="filterPhoto" onclick="setStatusFilter('photo')"><div class="stat-label">촬영 완료</div><div class="stat-val" id="statPhoto">0</div></div>
    <div class="stats-arrow">▶</div>
    <div class="stat-card stat-card-btn" id="filterRocket" onclick="setStatusFilter('rocket')"><div class="stat-label">쿠팡 등록 완료</div><div class="stat-val" id="statCats">0</div></div>
  </section>

  <!-- 필터 바 -->
  <div class="filter-left">
    <select id="catFilter" onchange="renderTable()">
      <option value="">전체 카테고리</option>
    </select>
    <input type="text" id="searchInput" placeholder="SKU 또는 상품명 검색" oninput="renderTable()" />
    <input type="date" id="dateFrom" onchange="renderTable()" />
    <span style="font-size:13px;color:var(--text-muted)">~</span>
    <input type="date" id="dateTo" onchange="renderTable()" />
    <button class="btn btn-ghost btn-sm" onclick="clearDateFilter()">날짜 초기화</button>
  </div>
  <div class="filter-right">
    <span class="realtime-dot" id="realtimeDot"></span>
    <span class="realtime-label">실시간 동기화</span>
  </div>

  <!-- 일괄 작업 바 -->
  <div id="bulkBar" style="display:none;align-items:center;gap:8px;padding:8px 0;margin-bottom:4px">
    <span id="bulkCount" style="font-size:13px;color:var(--text-secondary)"></span>
    <button class="btn btn-ghost btn-sm" onclick="bulkSetStatus(true)">N → Y 일괄 변경</button>
    <button class="btn btn-ghost btn-sm" onclick="bulkSetStatus(false)">Y → N 일괄 변경</button>
    <button class="btn btn-danger btn-sm" onclick="bulkDelete()">선택 삭제</button>
  </div>

  <!-- 테이블 -->
  <section class="table-section">
    <div class="table-wrap">
      <table id="mainTable">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="chkAll" onclick="toggleSelectAll(this)" /></th>
            <th>SKU 코드</th>
            <th class="col-name">상품명</th>
            <th>카테고리</th>
            <th>한국으로<br>오는 중</th>
            <th>주문 날짜</th>
            <th>주문 수량</th>
            <th>파손 물량</th>
            <th>사용 가능</th>
            <th>공장 도착</th>
            <th>사진 촬영</th>
            <th>쿠팡 등록 완료</th>
            <th>비고</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">
        <div class="empty-icon">📋</div>
        <div class="empty-title">등록된 상품이 없습니다</div>
        <div class="empty-desc">상품 추가 버튼을 눌러 첫 번째 발주를 등록하세요.</div>
        <button class="btn btn-primary" onclick="openModal()">+ 상품 추가</button>
      </div>
    </div>
  </section>

</main>

</div><!-- /appScreen -->

<!-- 수정 모달 -->
<div class="modal-bg" id="modalBg" onclick="onBgClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">상품 추가</h2>
      <button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row-2">
        <div class="form-group">
          <label for="fSku">SKU 코드 <span class="req">*</span></label>
          <input id="fSku" type="text" placeholder="예) SKU-001" />
        </div>
        <div class="form-group">
          <label for="fCat">카테고리 <span class="req">*</span></label>
          <select id="fCat" onchange="onCatSelectChange()">
            <option value="">카테고리 선택</option>
            <option value="__custom__">직접 입력...</option>
          </select>
          <input id="fCatCustom" type="text" placeholder="새 카테고리 직접 입력" style="display:none; margin-top:6px" />
        </div>
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label for="fShipping">한국으로 오는 중</label>
          <select id="fShipping">
            <option value="false">N</option>
            <option value="true">Y</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fOrderedAt">주문한 날짜</label>
          <input id="fOrderedAt" type="date" />
        </div>
      </div>
      <div class="form-group">
        <label for="fName">상품명 <span class="req">*</span></label>
        <input id="fName" type="text" placeholder="상품명 입력" />
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label for="fQty">주문 수량</label>
          <input id="fQty" type="number" min="0" placeholder="0" />
        </div>
        <div class="form-group">
          <label for="fBrk">파손 물량</label>
          <input id="fBrk" type="number" min="0" placeholder="0" />
        </div>
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label for="fFac">공장 도착</label>
          <select id="fFac">
            <option value="false">N</option>
            <option value="true">Y</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fPhoto">사진 촬영</label>
          <select id="fPhoto">
            <option value="false">N</option>
            <option value="true">Y</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fCouReg">쿠팡 등록 완료</label>
          <select id="fCouReg">
            <option value="false">N</option>
            <option value="true">Y</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="fNote">비고</label>
        <input id="fNote" type="text" placeholder="메모" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveItem()" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 이력 모달 -->
<div id="logsBg" onclick="onLogsBgClick(event)">
  <div class="logs-modal">
    <div class="logs-modal-header">
      <h2 id="logsTitle">변경 이력</h2>
      <button class="modal-close" onclick="closeLogsModal()" aria-label="닫기">✕</button>
    </div>
    <div id="logsBody"></div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
  const SUPABASE_URL = "{{ supabase_url }}";
  const SUPABASE_KEY = "{{ supabase_key }}";
</script>
<script src="/static/js/app.js?v=4"></script>
<script>
  document.addEventListener('mousemove', e => {
    document.querySelectorAll('.note-cell').forEach(el => {
      el.style.setProperty('--tt-x', (e.clientX + 12) + 'px');
      el.style.setProperty('--tt-y', (e.clientY + 12) + 'px');
    });
  });
</script>
</body>
</html>
